<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 146" width="880" height="146" role="img" aria-label="So either: A) something here caught your attention. B) you clicked by accident. C) you were intrigued by my profile pic. D) you also have too many tabs open.">
<style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
<rect x="1" y="1" width="430" height="62" rx="12" fill="#0f1216" stroke="#232830"/>
<circle cx="37" cy="32" r="14" fill="none" stroke="#f0b44c" stroke-opacity=".7"/>
<text x="37" y="36.5" font-size="13" font-weight="700" fill="#f0b44c" text-anchor="middle">A</text>
<text x="67" y="37" font-size="13.5" fill="#d7d9dd">something here caught your attention.</text>
<rect x="449" y="1" width="430" height="62" rx="12" fill="#0f1216" stroke="#232830"/>
<circle cx="485" cy="32" r="14" fill="none" stroke="#f0b44c" stroke-opacity=".7"/>
<text x="485" y="36.5" font-size="13" font-weight="700" fill="#f0b44c" text-anchor="middle">B</text>
<text x="515" y="37" font-size="13.5" fill="#d7d9dd">you clicked by accident.</text>
<rect x="1" y="81" width="430" height="62" rx="12" fill="#0f1216" stroke="#232830"/>
<circle cx="37" cy="112" r="14" fill="none" stroke="#f0b44c" stroke-opacity=".7"/>
<text x="37" y="116.5" font-size="13" font-weight="700" fill="#f0b44c" text-anchor="middle">C</text>
<text x="67" y="117" font-size="13.5" fill="#d7d9dd">you were intrigued by my profile pic.</text>
<rect x="449" y="81" width="430" height="62" rx="12" fill="#0f1216" stroke="#232830"/>
<circle cx="485" cy="112" r="14" fill="none" stroke="#f0b44c" stroke-opacity=".7"/>
<text x="485" y="116.5" font-size="13" font-weight="700" fill="#f0b44c" text-anchor="middle">D</text>
<text x="515" y="117" font-size="13.5" fill="#d7d9dd">you also have too many tabs open.</text>
</svg>