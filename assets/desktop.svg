<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Ayesha's desktop: a terminal listing six folders: coding, reading, making cha, ML rabbit hole, nuclear accidents, questionable decisions. 17 tabs open, 4 important, she doesn't know which 4.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rule { stroke: #232830; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .t { font-size: 13px; fill: #e4e2dd; }
    .dim { fill: #6f7680; }
    .amber { fill: #f0b44c; }
    .teal { fill: #7aa7b8; }
    .label { font-size: 10.5px; text-anchor: middle; fill: currentColor; }
    .glyph { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* boot */
    .boot { animation: type 0.9s steps(12) 0.3s both; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }
    .in { animation: appear .5s ease-out both; }
    @keyframes appear { from { opacity: 0; } }

    /* idle motion */
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }
    .steam { animation: rise 2.6s ease-in-out infinite; }
    .steam.b { animation-delay: 1.3s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-4px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes gone { to { opacity: 0; } }

    /* 24s loop: each folder gets 4s in the spotlight */
    .icon { color: #6f7680; animation: glow 24s ease infinite backwards; }
    .icon .tile { fill: transparent; stroke: #f0b44c; stroke-opacity: 0; animation: tile 24s ease infinite backwards; animation-delay: inherit; }
    @keyframes glow { 0% { color: #6f7680; } 1% { color: #f0b44c; } 15.6% { color: #f0b44c; } 16.6% { color: #6f7680; } 100% { color: #6f7680; } }
    @keyframes tile { 0% { fill: transparent; stroke-opacity: 0; } 1% { fill: #161a20; stroke-opacity: .5; } 15.6% { fill: #161a20; stroke-opacity: .5; } 16.6% { fill: transparent; stroke-opacity: 0; } 100% { fill: transparent; stroke-opacity: 0; } }

    .run { opacity: 0; animation: run 24s linear infinite backwards; }
    @keyframes run { 0% { opacity: 0; } .1% { opacity: 1; } 15.8% { opacity: 1; } 16.6% { opacity: 0; } 100% { opacity: 0; } }
    .cover { animation: cover 24s infinite backwards; }
    @keyframes cover { 0% { transform: translateX(0); } 5% { transform: translateX(var(--w)); } 100% { transform: translateX(var(--w)); } }
    .quip { opacity: 0; animation: quip 24s ease infinite backwards; animation-delay: inherit; }
    @keyframes quip { 0%, 6% { opacity: 0; } 7% { opacity: 1; } 15.8% { opacity: 1; } 16.6%, 100% { opacity: 0; } }

    .tab { fill: transparent; stroke: #3b4048; stroke-width: 1.3; }
    .lit { animation: lit 24s ease infinite backwards; }
    @keyframes lit { 0% { fill: transparent; stroke: #3b4048; } 1% { fill: #f0b44c; stroke: #f0b44c; } 32% { fill: #f0b44c; stroke: #f0b44c; } 33.3%, 100% { fill: transparent; stroke: #3b4048; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .run { opacity: 0; } }
  </style>
  <defs><clipPath id="frame"><rect width="880" height="440" rx="14"/></clipPath></defs>
  <g clip-path="url(#frame)">
  <rect width="880" height="440" fill="#0f1216"/>

  <!-- header -->
  <circle cx="30" cy="22" r="4" fill="#f0b44c"/>
  <text class="sans" x="46" y="27" font-size="14" font-weight="700" fill="#ffffff">ayesha<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#6f7680" xml:space="preserve">   ayesha@desktop — zsh — 17 tabs</tspan></text>
  <text x="856" y="26" font-size="11.5" fill="#6f7680" text-anchor="end">it's 2:07 a.m.</text>
  <line class="rule" x1="0" y1="44.5" x2="880" y2="44.5"/>

  <!-- left panel: the folders -->
  <rect x="24.5" y="60.5" width="547" height="251" rx="12" fill="#0b0d10" stroke="#1e2229"/>
  <text class="t" x="46" y="92" xml:space="preserve" textLength="241.8" lengthAdjust="spacing"><tspan class="teal">ayesha@desktop</tspan><tspan class="dim"> ~ </tspan><tspan class="amber">❯ </tspan>ls ~/desktop</text>
  <g class="boot" style="--w:96px">
    <rect x="195" y="78" width="110" height="20" fill="#0b0d10"/>
    <g style="animation:gone .2s 2.3s forwards"><rect class="blink" x="195" y="81" width="7" height="14" fill="#f0b44c"/></g>
  </g>
  <g class="in" style="animation-delay:1.2s">
    <g class="icon" transform="translate(116 148)" style="animation-delay:2.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph"><rect x="-17" y="-13" width="34" height="26" rx="4"/><path d="M-9 -4 l5 4 l-5 4"/><path d="M1 5 h8"/></g><text class="label" y="38">coding</text></g><g class="icon" transform="translate(298 148)" style="animation-delay:6.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph"><path d="M0 -9 C-6 -13 -13 -13 -17 -11 V11 C-13 9 -6 9 0 13 C6 9 13 9 17 11 V-11 C13 -13 6 -13 0 -9 Z"/><path d="M0 -9 V13"/></g><text class="label" y="38">reading</text></g><g class="icon" transform="translate(480 148)" style="animation-delay:10.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph">
          <path d="M-14 -3 H8 V7 a8 8 0 0 1 -8 8 H-6 a8 8 0 0 1 -8 -8 Z"/><path d="M8 0 h3 a4 4 0 0 1 0 8 h-3"/>
          <path class="steam" d="M-7 -8 q-3 -3 0 -7"/><path class="steam b" d="M1 -8 q-3 -3 0 -7"/>
        </g><text class="label" y="38">making cha</text></g><g class="icon" transform="translate(116 244)" style="animation-delay:14.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph"><path class="spin" d="M0 0 a3 3 0 0 1 6 0 a6 6 0 0 1 -12 0 a9 9 0 0 1 18 0 a12 12 0 0 1 -24 0 a15 15 0 0 1 30 0"/></g><text class="label" y="38">ML rabbit hole</text></g><g class="icon" transform="translate(298 244)" style="animation-delay:18.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph">
          <circle r="2.5"/>
          <path d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
          <path transform="rotate(120)" d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
          <path transform="rotate(240)" d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
        </g><text class="label" y="38">nuclear accidents</text></g><g class="icon" transform="translate(480 244)" style="animation-delay:22.4s"><rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/><g class="glyph"><circle r="15"/><path d="M-5 -5 a5 5 0 1 1 7 4.6 c-2 1 -2 2.4 -2 4"/><circle cx="0" cy="8.5" r="0.6" stroke-width="2.2"/></g><text class="label" y="38">questionable decisions</text></g>
  </g>

  <!-- right panel: the tabs -->
  <rect x="588.5" y="60.5" width="267" height="251" rx="12" fill="#0b0d10" stroke="#1e2229"/>
  <g class="in" style="animation-delay:1.6s">
    <text class="t" x="610" y="104" xml:space="preserve"><tspan class="amber">❯ </tspan>cat important_tabs.txt</text>
    <text class="t dim" x="610" y="140">17 tabs currently open.</text>
    <text class="t dim" x="610" y="162">4 of them are important.</text>
    <text class="t" x="610" y="184">I don't know which 4.</text>
    <line x1="610" y1="189.5" x2="774" y2="189.5" stroke="#3b4048" stroke-dasharray="2 3"/>
    <circle class="tab" cx="612.0" cy="232" r="3.5"/><circle class="tab lit" cx="625.5" cy="232" r="3.5" style="animation-delay:10.4s"/><circle class="tab lit" cx="639.0" cy="232" r="3.5" style="animation-delay:2.4s"/><circle class="tab lit" cx="652.5" cy="232" r="3.5" style="animation-delay:18.4s"/><circle class="tab" cx="666.0" cy="232" r="3.5"/><circle class="tab lit" cx="679.5" cy="232" r="3.5" style="animation-delay:10.4s"/><circle class="tab" cx="693.0" cy="232" r="3.5"/><circle class="tab lit" cx="706.5" cy="232" r="3.5" style="animation-delay:2.4s"/><circle class="tab lit" cx="720.0" cy="232" r="3.5" style="animation-delay:18.4s"/><circle class="tab lit" cx="733.5" cy="232" r="3.5" style="animation-delay:2.4s"/><circle class="tab" cx="747.0" cy="232" r="3.5"/><circle class="tab lit" cx="760.5" cy="232" r="3.5" style="animation-delay:10.4s"/><circle class="tab lit" cx="774.0" cy="232" r="3.5" style="animation-delay:18.4s"/><circle class="tab lit" cx="787.5" cy="232" r="3.5" style="animation-delay:18.4s"/><circle class="tab lit" cx="801.0" cy="232" r="3.5" style="animation-delay:2.4s"/><circle class="tab" cx="814.5" cy="232" r="3.5"/><circle class="tab lit" cx="828.0" cy="232" r="3.5" style="animation-delay:10.4s"/>
  </g>

  <!-- live prompt: one command per folder, looping -->
  <g class="in" style="animation-delay:2s"><text class="t amber" x="46" y="352">❯</text></g>
  <g class="run" style="animation-delay:2.4s"><text class="t" x="62" y="352" textLength="163.8" lengthAdjust="spacing">git log --latest-push</text><g class="cover" style="--w:166px;animation-timing-function:steps(21);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">it works on my machine. ship it.</text></g>
<g class="run" style="animation-delay:6.4s"><text class="t" x="62" y="352" textLength="226.2" lengthAdjust="spacing">cat ~/shelf/currently-reading</text><g class="cover" style="--w:228px;animation-timing-function:steps(29);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">one extremely fast-paced thriller. no spoilers.</text></g>
<g class="run" style="animation-delay:10.4s"><text class="t" x="62" y="352" textLength="296.4" lengthAdjust="spacing">brew lebu-cha --with cinnamon,cardamom</text><g class="cover" style="--w:298px;animation-timing-function:steps(38);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">kettle&#x27;s on. everything else can wait.</text></g>
<g class="run" style="animation-delay:14.4s"><text class="t" x="62" y="352" textLength="210.6" lengthAdjust="spacing">python -c &quot;model.fit(X, y)&quot;</text><g class="cover" style="--w:212px;animation-timing-function:steps(27);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">okay but what is that line actually doing.</text></g>
<g class="run" style="animation-delay:18.4s"><text class="t" x="62" y="352" textLength="179.4" lengthAdjust="spacing">less ines_incidents.log</text><g class="cover" style="--w:181px;animation-timing-function:steps(23);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">researching. purely academically.</text></g>
<g class="run" style="animation-delay:22.4s"><text class="t" x="62" y="352" textLength="171.6" lengthAdjust="spacing">fortune --questionable</text><g class="cover" style="--w:173px;animation-timing-function:steps(22);animation-delay:inherit"><rect x="62" y="338" width="340" height="20" fill="#0f1216"/><rect class="blink" x="62" y="341" width="7" height="14" fill="#f0b44c"/></g><text class="t dim quip" x="62" y="378">git push --force. on a friday. at 6 p.m.</text></g>

  <!-- status line -->
  <rect x="0" y="398" width="880" height="42" fill="#0b0d10"/>
  <line class="rule" x1="0" y1="398.5" x2="880" y2="398.5"/>
  <rect x="24" y="408" width="78" height="22" rx="11" fill="#f0b44c"/>
  <text x="63" y="423" font-size="10" font-weight="700" letter-spacing="1" fill="#0b0c0f" text-anchor="middle">NORMAL</text>
  <text x="116" y="423" font-size="11" fill="#6f7680">~/desktop</text>
  <text x="440" y="423" font-size="9.5" fill="#f0b44c" fill-opacity=".65" text-anchor="middle" letter-spacing="1.8">CLICK FOR THE ONE THAT ACTUALLY OPENS ↗</text>
  <text x="856" y="423" font-size="11" fill="#6f7680" text-anchor="end">6 items · 17 tabs</text>
  </g>
  <rect x=".5" y=".5" width="879" height="439" rx="14" fill="none" stroke="#232830"/>
</svg>
