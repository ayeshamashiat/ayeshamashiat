<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-label="Ayesha's desktop: a terminal listing six folders: coding, reading, making cha, ML rabbit hole, nuclear accidents, questionable decisions. 17 tabs open, 4 important, she doesn't know which 4.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .rule { stroke: #1e2229; }
    .mb { font-size: 11px; fill: #3b4048; }
    .t { font-size: 13px; fill: #e4e2dd; }
    .dim { fill: #6f7680; }
    .amber { fill: #f0b44c; }
    .teal { fill: #7aa7b8; }
    .label { font-size: 10.5px; text-anchor: middle; fill: currentColor; }
    .glyph { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* boot */
    .boot { animation: type 0.9s steps(12) 0.3s both; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }
    .in { animation: appear .5s ease-out both; }
    @keyframes appear { from { opacity: 0; } }

    /* idle motion */
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }
    .steam { animation: rise 2.6s ease-in-out infinite; }
    .steam.b { animation-delay: 1.3s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-4px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes gone { to { opacity: 0; } }

    /* 24s loop: each folder gets 4s in the spotlight */
    .icon { color: #6f7680; animation: glow 24s ease infinite backwards; }
    .icon .tile { fill: transparent; stroke: #f0b44c; stroke-opacity: 0; animation: tile 24s ease infinite backwards; animation-delay: inherit; }
    @keyframes glow { 0% { color: #6f7680; } 1% { color: #f0b44c; } 15.6% { color: #f0b44c; } 16.6% { color: #6f7680; } 100% { color: #6f7680; } }
    @keyframes tile { 0% { fill: transparent; stroke-opacity: 0; } 1% { fill: #171a1f; stroke-opacity: .45; } 15.6% { fill: #171a1f; stroke-opacity: .45; } 16.6% { fill: transparent; stroke-opacity: 0; } 100% { fill: transparent; stroke-opacity: 0; } }

    .run { opacity: 0; animation: run 24s linear infinite backwards; }
    @keyframes run { 0% { opacity: 0; } .1% { opacity: 1; } 15.8% { opacity: 1; } 16.6% { opacity: 0; } 100% { opacity: 0; } }
    .cover { animation: cover 24s infinite backwards; }
    @keyframes cover { 0% { transform: translateX(0); } 5% { transform: translateX(var(--w)); } 100% { transform: translateX(var(--w)); } }
    .quip { opacity: 0; animation: quip 24s ease infinite backwards; animation-delay: inherit; }
    @keyframes quip { 0%, 6% { opacity: 0; } 7% { opacity: 1; } 15.8% { opacity: 1; } 16.6%, 100% { opacity: 0; } }

    .tab { fill: transparent; stroke: #3b4048; stroke-width: 1.3; }
    .lit { animation: lit 24s ease infinite backwards; }
    @keyframes lit { 0% { fill: transparent; stroke: #3b4048; } 1% { fill: #f0b44c; stroke: #f0b44c; } 32% { fill: #f0b44c; stroke: #f0b44c; } 33.3%, 100% { fill: transparent; stroke: #3b4048; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .run { opacity: 0; } }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="0.9" fill="#1a1d22"/></pattern>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity="0.018"/></pattern>
    <radialGradient id="glowA" cx="170" cy="110" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0b44c" stop-opacity="0.07"/><stop offset="1" stop-color="#f0b44c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="620" cy="560" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa7b8" stop-opacity="0.06"/><stop offset="1" stop-color="#7aa7b8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.7"/></filter>
    <clipPath id="wclip"><rect x="80" y="64" width="560" height="484" rx="12"/></clipPath>
    <clipPath id="frame"><rect width="720" height="600" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
  <!-- wallpaper -->
  <rect width="720" height="600" fill="#08090b"/>
  <rect width="720" height="600" fill="url(#dots)"/>
  <rect width="720" height="600" fill="url(#glowA)"/>
  <rect width="720" height="600" fill="url(#glowB)"/>

  <!-- menubar -->
  <rect width="720" height="28" fill="#0b0c0f" fill-opacity=".85"/>
  <line class="rule" x1="0" y1="28.5" x2="720" y2="28.5"/>
  <text class="mb amber" x="16" y="18.5">◆</text>
  <text class="mb" x="32" y="18.5" style="fill:#e4e2dd;font-weight:600">ayesha</text>
  <text class="mb" x="96" y="18.5" xml:space="preserve">file   edit   view   tabs</text>
  <text class="mb" x="704" y="18.5" text-anchor="end" style="fill:#6f7680">it's 2:07 a.m.</text>

  <!-- window -->
  <rect x="80" y="64" width="560" height="484" rx="12" fill="#0f1114" filter="url(#shadow)"/>
  <g clip-path="url(#wclip)">
    <rect x="80" y="64" width="560" height="36" fill="#0b0c0f"/>
    <line class="rule" x1="80" y1="100.5" x2="640" y2="100.5"/>
    <circle cx="102" cy="82" r="5.5" fill="#e06c5f" opacity=".55"/>
    <circle cx="120" cy="82" r="5.5" fill="#e3b04b" opacity=".55"/>
    <circle cx="138" cy="82" r="5.5" fill="#6cb36a" opacity=".55"/>
    <text x="360" y="86" font-size="11" fill="#3b4048" text-anchor="middle">ayesha@desktop — zsh — 17 tabs</text>

    <!-- prompt 1 (types itself) -->
    <text class="t" x="108" y="132" xml:space="preserve" textLength="241.8" lengthAdjust="spacing"><tspan class="teal">ayesha@desktop</tspan><tspan class="dim"> ~ </tspan><tspan class="amber">❯ </tspan>ls ~/desktop</text>
    <g class="boot" style="--w:96px">
      <rect x="257" y="118" width="110" height="20" fill="#0f1114"/>
      <g style="animation:gone .2s 2.3s forwards"><rect class="blink" x="257" y="121" width="7" height="14" fill="#f0b44c"/></g>
    </g>

    <!-- folders -->
    <g class="in" style="animation-delay:1.2s">
      <g class="icon" transform="translate(184 186)" style="animation-delay:2.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph"><rect x="-17" y="-13" width="34" height="26" rx="4"/><path d="M-9 -4 l5 4 l-5 4"/><path d="M1 5 h8"/></g>
        <text class="label" y="38">coding</text>
      </g>
      <g class="icon" transform="translate(352 186)" style="animation-delay:6.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph"><path d="M0 -9 C-6 -13 -13 -13 -17 -11 V11 C-13 9 -6 9 0 13 C6 9 13 9 17 11 V-11 C13 -13 6 -13 0 -9 Z"/><path d="M0 -9 V13"/></g>
        <text class="label" y="38">reading</text>
      </g>
      <g class="icon" transform="translate(520 186)" style="animation-delay:10.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph">
          <path d="M-14 -3 H8 V7 a8 8 0 0 1 -8 8 H-6 a8 8 0 0 1 -8 -8 Z"/><path d="M8 0 h3 a4 4 0 0 1 0 8 h-3"/>
          <path class="steam" d="M-7 -8 q-3 -3 0 -7"/><path class="steam b" d="M1 -8 q-3 -3 0 -7"/>
        </g>
        <text class="label" y="38">making cha</text>
      </g>
      <g class="icon" transform="translate(184 282)" style="animation-delay:14.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph"><path class="spin" d="M0 0 a3 3 0 0 1 6 0 a6 6 0 0 1 -12 0 a9 9 0 0 1 18 0 a12 12 0 0 1 -24 0 a15 15 0 0 1 30 0"/></g>
        <text class="label" y="38">ML rabbit hole</text>
      </g>
      <g class="icon" transform="translate(352 282)" style="animation-delay:18.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph">
          <circle r="2.5"/>
          <path d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
          <path transform="rotate(120)" d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
          <path transform="rotate(240)" d="M-2.5 -4.33 L-7.5 -12.99 A15 15 0 0 1 7.5 -12.99 L2.5 -4.33 A5 5 0 0 0 -2.5 -4.33 Z"/>
        </g>
        <text class="label" y="38">nuclear accidents</text>
      </g>
      <g class="icon" transform="translate(520 282)" style="animation-delay:22.4s">
        <rect class="tile" x="-76" y="-26" width="152" height="74" rx="9"/>
        <g class="glyph"><circle r="15"/><path d="M-5 -5 a5 5 0 1 1 7 4.6 c-2 1 -2 2.4 -2 4"/><circle cx="0" cy="8.5" r="0.6" stroke-width="2.2"/></g>
        <text class="label" y="38">questionable decisions</text>
      </g>
    </g>

    <!-- tabs -->
    <g class="in" style="animation-delay:1.6s">
      <text class="t" x="108" y="364" xml:space="preserve"><tspan class="amber">❯ </tspan>cat important_tabs.txt</text>
      <text class="t dim" x="108" y="390">17 tabs currently open.</text>
      <text class="t dim" x="108" y="410">4 of them are important.</text>
      <text class="t" x="108" y="430">I don't know which 4.</text>
      <line x1="108" y1="435.5" x2="272" y2="435.5" stroke="#3b4048" stroke-dasharray="2 3"/>
      <circle class="tab" cx="112" cy="454" r="3.5"/>
      <circle class="tab lit" cx="127" cy="454" r="3.5" style="animation-delay:10.4s"/>
      <circle class="tab lit" cx="142" cy="454" r="3.5" style="animation-delay:2.4s"/>
      <circle class="tab lit" cx="157" cy="454" r="3.5" style="animation-delay:18.4s"/>
      <circle class="tab" cx="172" cy="454" r="3.5"/>
      <circle class="tab lit" cx="187" cy="454" r="3.5" style="animation-delay:10.4s"/>
      <circle class="tab" cx="202" cy="454" r="3.5"/>
      <circle class="tab lit" cx="217" cy="454" r="3.5" style="animation-delay:2.4s"/>
      <circle class="tab lit" cx="232" cy="454" r="3.5" style="animation-delay:18.4s"/>
      <circle class="tab lit" cx="247" cy="454" r="3.5" style="animation-delay:2.4s"/>
      <circle class="tab" cx="262" cy="454" r="3.5"/>
      <circle class="tab lit" cx="277" cy="454" r="3.5" style="animation-delay:10.4s"/>
      <circle class="tab lit" cx="292" cy="454" r="3.5" style="animation-delay:18.4s"/>
      <circle class="tab lit" cx="307" cy="454" r="3.5" style="animation-delay:18.4s"/>
      <circle class="tab lit" cx="322" cy="454" r="3.5" style="animation-delay:2.4s"/>
      <circle class="tab" cx="337" cy="454" r="3.5"/>
      <circle class="tab lit" cx="352" cy="454" r="3.5" style="animation-delay:10.4s"/>
    </g>

    <!-- live prompt: one command per folder, looping -->
    <g class="in" style="animation-delay:2s">
      <text class="t amber" x="108" y="490">❯</text>
    </g>

    <g class="run" style="animation-delay:2.4s">
      <text class="t" x="124" y="490" textLength="163.8" lengthAdjust="spacing">git log --latest-push</text>
      <g class="cover" style="--w:166px;animation-timing-function:steps(21);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">it works on my machine. ship it.</text>
    </g>
    <g class="run" style="animation-delay:6.4s">
      <text class="t" x="124" y="490" textLength="226.2" lengthAdjust="spacing">cat ~/shelf/currently-reading</text>
      <g class="cover" style="--w:228px;animation-timing-function:steps(29);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">one extremely fast-paced thriller. no spoilers.</text>
    </g>
    <g class="run" style="animation-delay:10.4s">
      <text class="t" x="124" y="490" textLength="296.4" lengthAdjust="spacing">brew lebu-cha --with cinnamon,cardamom</text>
      <g class="cover" style="--w:298px;animation-timing-function:steps(38);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">kettle's on. everything else can wait.</text>
    </g>
    <g class="run" style="animation-delay:14.4s">
      <text class="t" x="124" y="490" textLength="210.6" lengthAdjust="spacing">python -c "model.fit(X, y)"</text>
      <g class="cover" style="--w:212px;animation-timing-function:steps(27);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">okay but what is that line actually doing.</text>
    </g>
    <g class="run" style="animation-delay:18.4s">
      <text class="t" x="124" y="490" textLength="179.4" lengthAdjust="spacing">less ines_incidents.log</text>
      <g class="cover" style="--w:181px;animation-timing-function:steps(23);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">researching. purely academically.</text>
    </g>
    <g class="run" style="animation-delay:22.4s">
      <text class="t" x="124" y="490" textLength="171.6" lengthAdjust="spacing">fortune --questionable</text>
      <g class="cover" style="--w:173px;animation-timing-function:steps(22);animation-delay:inherit">
        <rect x="124" y="476" width="330" height="20" fill="#0f1114"/><rect class="blink" x="124" y="479" width="7" height="14" fill="#f0b44c"/>
      </g>
      <text class="t dim quip" x="124" y="510">git push --force. on a friday. at 6 p.m.</text>
    </g>

    <!-- status line -->
    <rect x="80" y="522" width="560" height="26" fill="#0b0c0f"/>
    <line class="rule" x1="80" y1="522.5" x2="640" y2="522.5"/>
    <rect x="80" y="522" width="78" height="26" fill="#f0b44c"/>
    <text x="119" y="539" font-size="10" font-weight="600" letter-spacing="1" fill="#0b0c0f" text-anchor="middle">NORMAL</text>
    <text x="172" y="539" font-size="10.5" fill="#6f7680">~/desktop</text>
    <text x="624" y="539" font-size="10.5" fill="#3b4048" text-anchor="end">6 items · 17 tabs</text>

    <rect x="80" y="64" width="560" height="484" fill="url(#scan)"/>
  </g>
  <rect x="80.5" y="64.5" width="559" height="483" rx="12" fill="none" stroke="url(#edge)"/>

  <text x="360" y="582" font-size="10" fill="#3b4048" text-anchor="middle" letter-spacing="2">CLICK FOR THE ONE THAT ACTUALLY OPENS ↗</text>
  </g>
</svg>
