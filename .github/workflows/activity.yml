name: activity

on:
  schedule:
    - cron: "17 0 * * *"  # 06:17 in Dhaka, after the day being judged has ended
  workflow_dispatch:

permissions:
  contents: write  # to push the README; everything read is public

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python -m unittest discover -s tests
      - name: Rebuild mom's line and the ship log
        run: python scripts/activity.py ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/mom-history.json
          git commit -m "chore(activity): refresh mom's line and ship log"
          git push
